[project]
name = "soda-duckdb"
version = "4.30.0"
description = "Soda DuckDB V4"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Soda Data N.V.", email = "info@soda.io"}
]
dependencies = [
    "soda-core==4.30.0",
    # duckdb<2: 2.0.0 requires Python >=3.11 while this package declares
    # >=3.10. Unbounded, duckdb resolves 2.0.0 wherever 3.11+ is available,
    # which would ship an untested major. All of 1.x is allowed deliberately:
    # 1.5.6 ships wheels cp310-cp314, so it covers the whole matrix.
    # Lift when requires-python reaches 3.11.
    "duckdb>=1.2.0,<2",
    "pytz",
]

[project.entry-points."soda.plugins.data_source.duckdb"]
DuckDBDataSourceImpl = "soda_duckdb.common.data_sources.duckdb_data_source:DuckDBDataSourceImpl"

[tool.uv.sources]
soda-core = { workspace = true }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
