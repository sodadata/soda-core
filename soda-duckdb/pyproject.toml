[project]
name = "soda-duckdb"
version = "4.29.1rc0"
description = "Soda DuckDB V4"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Soda Data N.V.", email = "info@soda.io"}
]
dependencies = [
    "soda-core==4.29.1rc0",
    # <2 because duckdb 2.0.0 requires Python >=3.11 while the launchers
    # build on 3.10. Left unbounded, uv resolves 2.0.0 for 3.11+ and 1.5.6
    # for 3.10, so the lockfile carries two duckdb versions - one of them a
    # major nothing here tests. Agreed with Niels Bylois, 2026-11-04. Lift
    # the cap when the launchers move to 3.11.
    "duckdb>=1.2.0,<2",
    "pytz",
]

[project.entry-points."soda.plugins.data_source.duckdb"]
DuckDBDataSourceImpl = "soda_duckdb.common.data_sources.duckdb_data_source:DuckDBDataSourceImpl"

[tool.uv.sources]
soda-core = { workspace = true }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
