# Check path grammar: the wire checkPath and the identity of each check form in a contract.
#
# Asserted by soda-tests/tests/unit/test_check_path_grammar.py, which builds each row as a one-check
# contract on the dataset below with a data source named like its first segment. checkPath is the grammar
# and is written by hand. identity is recorded: SODA_TEST_RECORD_FIXTURES=1 rewrites it.
#
# Unscoped rows recorded on soda-core origin/main ac8c7474, before any scope code (DET-235 stage 0).
# C-2 adds each row again with the scope.eu: prefix. The backend mirrors this list (DET-206).
#
# TODO(X-4): the reconciliation rows need soda-reconciliation, which lives in soda-extensions, so X-4
# records and asserts them there:
#   reconciliation.checks.row_count_diff
#   reconciliation.payments.checks.aggregate_diff
#   reconciliation.payments.checks.aggregate_diff.sum
dataset: fixture_ds/main/orders
rows:
  - checkPath: checks.row_count
    identity:
    check:
      row_count:
  - checkPath: checks.row_count.2
    identity:
    check:
      row_count:
        qualifier: 2
  - checkPath: columns.amount.checks.invalid
    identity:
    column: amount
    check:
      invalid:
        valid_min: 0
  - checkPath: columns.amount.checks.invalid.strict
    identity:
    column: amount
    check:
      invalid:
        qualifier: strict
        valid_min: 1
  - checkPath: checks.schema
    identity:
    check:
      schema:
  # An empty qualifier is dropped from the path but kept in the identity.
  - checkPath: checks.row_count
    identity:
    check:
      row_count:
        qualifier: ''
