---
# Weekly sweep of old CI test schemas in the trino-s3 CI catalog (Glue, Iceberg on S3), using the same rules as
# soda-tests/tests/integration/test_drop_old_schema.py. Regular CI runs skip Trino in that test: drops on this catalog
# take half a minute or more each. One job starts Trino with a fresh 1h AWS session and runs the sweep
# SWEEP_PROCESSES times at once, each on its own equal share of the schemas.
# A sweep that hits the step timeout means a backlog has built up: run it again until it finishes in time.
#
# Manual runs: Actions > "Trino S3 test schema cleanup" > Run workflow (once this file is on main), or
#   gh workflow run trino-s3-schema-cleanup.yaml -f processes=10 -f dry_run=true
name: Trino S3 test schema cleanup

on:
  schedule:
    - cron: '0 2 * * 1'  # Mondays 2 AM UTC, two hours before soda-extensions' weekly cross-source snapshot recording
  workflow_dispatch:
    inputs:
      processes:
        description: Number of sweeps to run at the same time
        type: number
        default: 10
      dry_run:
        description: Only log the schemas that would be dropped
        type: boolean
        default: false
  # Runs the sweep on PR #2936 itself. Remove (and the head_ref condition below) before merging.
  pull_request:

permissions:
  contents: read

concurrency:
  group: trino-s3-schema-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    if: github.event_name != 'pull_request' || github.head_ref == 'test/trino-drop-old-schemas'
    runs-on: ubuntu-24.04
    env:
      # Inputs are passed through env, never interpolated into run scripts. Scheduled and pull request runs use the
      # defaults.
      SWEEP_PROCESSES: ${{ inputs.processes || 10 }}
      TEST_DATASOURCE: trino
      TRINO_CATALOG: iceberg
      SODA_TEST_SNAPSHOT: "off"
      SODA_CORE_TELEMETRY_LOCAL_TEST_MODE: "true"
      SODA_SCHEMA_CLEANUP_FORCE: "true"
      SODA_SCHEMA_CLEANUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # This job never pushes; don't leave GITHUB_TOKEN in git config for a later step to read,
          # especially as the job also holds AWS credentials.
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
      # Before "Configure Trino", so the 1h AWS session isn't spent on the sync.
      # --no-build: never build third-party source distributions (our own workspace packages are still built).
      # docopt (for tbump) and pyspark (for soda-sparkdf) only ship sdists and the sweep needs neither, so skip them.
      - name: Sync locked environment
        run: uv sync --locked --no-build --no-install-package docopt --no-install-package pyspark --all-packages --group dev
      - name: Configure Trino
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BUILD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BUILD_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_BUILD_DEFAULT_REGION }}
          TRINO_CI_ASSUME_ROLE_ARN: ${{ secrets.TRINO_CI_ASSUME_ROLE_ARN }}
          CI_MODULE: trino-s3
        run: bash scripts/start_trino_ci.sh
      # Each process is its own pytest session that sweeps shard N of SWEEP_PROCESSES; its log lines are prefixed
      # with [pN]. -p no:cacheprovider keeps the processes from writing .pytest_cache at the same time.
      - name: Sweep old schemas
        # Ends the sweep before the 1h AWS session from "Configure Trino" expires. A weekly sweep takes minutes.
        timeout-minutes: 50
        run: |
          pids=""
          for p in $(seq 1 "$SWEEP_PROCESSES"); do
            (
              set -o pipefail
              SODA_SCHEMA_CLEANUP_SHARD="$p/$SWEEP_PROCESSES" uv run --no-sync --no-build python -m pytest -ra -p no:cacheprovider \
                soda-tests/tests/integration/test_drop_old_schema.py -o log_cli=true --log-cli-level=INFO \
                2>&1 | sed -u "s/^/[p$p] /"
            ) &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do
            wait "$pid" || rc=1
          done
          exit $rc
      - name: Dump Trino logs
        if: always()
        run: docker logs trino-ci 2>&1 | tail -100
      - name: Stop Trino container
        if: always()
        run: docker rm -f trino-ci 2>/dev/null || true
