---
# TEMPORARY (#2936): drains the backlog of leftover Trino test schemas in the CI Glue catalog (Iceberg on S3).
# One job starts Trino with a fresh 1h AWS session and runs SWEEP_PROCESSES sweeps against it at once. Each
# sweeps in a random order, so they rarely drop the same schema at once. SODA_SCHEMA_CLEANUP_MAX_SECONDS stops
# each sweep before the session expires; re-run the job until a run logs "0 of N schemas match the cleanup rules".
# Delete this file before merging.
name: TEMP trino-s3 schema cleanup

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tmp-trino-s3-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    if: github.head_ref == 'test/trino-drop-old-schemas'
    runs-on: ubuntu-24.04
    env:
      SWEEP_PROCESSES: "6"
      TEST_DATASOURCE: trino
      TRINO_CATALOG: iceberg
      SODA_TEST_SNAPSHOT: "off"
      SODA_CORE_TELEMETRY_LOCAL_TEST_MODE: "true"
      SODA_SCHEMA_CLEANUP_FORCE: "true"
      # 50 minutes: leaves room for the steps between assuming the role and starting the sweep.
      SODA_SCHEMA_CLEANUP_MAX_SECONDS: "3000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # This job never pushes; don't leave GITHUB_TOKEN in git config for a later step to read,
          # especially as the job also holds AWS credentials.
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up UV
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
      # Before "Configure Trino", so the 1h AWS session isn't spent on the sync.
      # --no-build: never build third-party source distributions (our own workspace packages are still built).
      # docopt (for tbump) and pyspark (for soda-sparkdf) only ship sdists and the sweep needs neither, so skip them.
      - name: Sync locked environment
        run: uv sync --locked --no-build --no-install-package docopt --no-install-package pyspark --all-packages --group dev
      - name: Configure Trino
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BUILD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BUILD_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_BUILD_DEFAULT_REGION }}
          TRINO_CI_ASSUME_ROLE_ARN: ${{ secrets.TRINO_CI_ASSUME_ROLE_ARN }}
          CI_MODULE: trino-s3
        run: bash scripts/start_trino_ci.sh
      # Each process is its own pytest session; its log lines are prefixed with [pN].
      # -p no:cacheprovider keeps the processes from writing .pytest_cache at the same time.
      - name: Sweep old schemas
        run: |
          pids=""
          for p in $(seq 1 "$SWEEP_PROCESSES"); do
            (
              set -o pipefail
              uv run --no-sync --no-build python -m pytest -ra -p no:cacheprovider \
                soda-tests/tests/integration/test_drop_old_schema.py -o log_cli=true --log-cli-level=INFO \
                2>&1 | sed -u "s/^/[p$p] /"
            ) &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do
            wait "$pid" || rc=1
          done
          exit $rc
      - name: Dump Trino logs
        if: always()
        run: docker logs trino-ci 2>&1 | tail -100
      - name: Stop Trino container
        if: always()
        run: docker rm -f trino-ci 2>/dev/null || true
