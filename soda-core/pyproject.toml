[project]
name = "soda-core"
version = "4.24.1rc0"
description = "Soda core library & CLI"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Soda Data N.V.", email = "info@soda.io"}
]
dependencies = [
    # Floor 0.18.17 to overlap soda-mcp's range (ADO-338); 0.18 dropped the module-level safe_load/safe_dump — use the YAML() instance API. Capped <0.19: 0.19 repackages the C extension, widen only when tested. Keep in sync with soda-tests/memory_container/Dockerfile.
    "ruamel.yaml>=0.18.17,<0.19",
    "requests>=2.32.3,<2.34.0",
    "pydantic>=2.11,<3.0",
    "opentelemetry-api>=1.16.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.16.0,<2.0.0",
    "tabulate[widechars]",
    "python-dotenv~=1.0",
    "sqlglot",
]

[project.scripts]
soda = "soda_core.cli.cli:execute"

[project.entry-points."soda.plugins.check_types.core"]
CoreCheckTypes = "soda_core.contracts.impl.check_types.check_types:CoreCheckTypesPlugin"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["**/*.json"]
